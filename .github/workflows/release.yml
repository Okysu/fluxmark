name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify, build and publish
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/fluxmark
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./packages/fluxmark/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${PACKAGE_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version v${PACKAGE_VERSION}"
            exit 1
          fi
          echo "Publishing fluxmark@${PACKAGE_VERSION}"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build SDK
        run: pnpm --filter fluxmark build

      # Authentication: token-free. This repository publishes with npm trusted
      # publishing (OIDC) using the id-token permission above, so no npm token
      # secret is required and provenance is generated automatically.
      # Configure it on npmjs.com: package "fluxmark" -> Settings -> Trusted
      # publishing -> GitHub Actions (user Okysu, repository fluxmark, workflow
      # release.yml, environment npm, allowed action "npm publish").
      - name: Publish fluxmark with provenance
        run: pnpm --filter fluxmark publish --access public --provenance --no-git-checks

      # pnpm exits 0 when the version is already on the registry ("There are no new
      # packages that should be published"), which would mark a release green even
      # though nothing was published. Fail loudly unless the tag version is live.
      # The registry is probed with an unauthenticated request on purpose: the
      # .npmrc generated by setup-node references $NODE_AUTH_TOKEN, which would
      # break an `npm view` in a step that does not receive the token.
      - name: Verify the tag version is on the registry
        shell: bash
        run: |
          VERSION="$(node -p "require('./packages/fluxmark/package.json').version")"
          for attempt in 1 2 3 4 5; do
            if curl -fsS "https://registry.npmjs.org/fluxmark/${VERSION}" >/dev/null 2>&1; then
              echo "fluxmark@${VERSION} is available on npm"
              exit 0
            fi
            echo "Attempt ${attempt}: fluxmark@${VERSION} is not on the registry yet, retrying in 10s"
            sleep 10
          done
          echo "::error::fluxmark@${VERSION} was not published"
          exit 1
